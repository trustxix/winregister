name: Build & Release Installer

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      version:
        description: 'Version to build (no leading v)'
        required: true
        default: '0.0.0-dev'

permissions:
  contents: write

jobs:
  build:
    name: Build installer on Windows
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          # Full history and tags: the release-notes step needs to know which
          # version users could last install, and the default depth fetches
          # neither. https://github.com/actions/checkout#fetch-all-history
          fetch-depth: 0

      - name: Resolve version
        id: ver
        shell: pwsh
        run: |
          if ($env:GITHUB_REF -like 'refs/tags/v*') {
            $v = $env:GITHUB_REF -replace '^refs/tags/v', ''
          } else {
            $v = '${{ github.event.inputs.version }}'
          }
          if (-not $v) { $v = '0.0.0-dev' }
          "version=$v" | Out-File -FilePath $env:GITHUB_OUTPUT -Append
          Write-Host "Building WinRegister v$v"

      - name: Verify version in WinRegister.ps1 matches tag
        shell: pwsh
        run: |
          $v = '${{ steps.ver.outputs.version }}'
          $found = (Get-Content WinRegister.ps1 -Raw) -match "Version\s*=\s*'([^']+)'"
          if (-not $found) {
            Write-Error "Could not find Version in WinRegister.ps1"
            exit 1
          }
          $scriptVer = $Matches[1]
          if ($scriptVer -ne $v) {
            Write-Error "Tag version ($v) does not match WinRegister.ps1 Version ($scriptVer). Bump the script's Cfg.Version first."
            exit 1
          }
          Write-Host "OK: WinRegister.ps1 Version = $scriptVer"

      - name: PowerShell syntax check
        shell: pwsh
        run: |
          $tokens = $null; $errors = $null
          $null = [System.Management.Automation.Language.Parser]::ParseFile(
            (Resolve-Path WinRegister.ps1).Path, [ref]$tokens, [ref]$errors)
          if ($errors.Count -gt 0) {
            $errors | ForEach-Object { Write-Host "L$($_.Extent.StartLineNumber): $($_.Message)" }
            exit 1
          }
          Write-Host "OK: parses cleanly"

      - name: Build release notes from CHANGELOG
        shell: pwsh
        run: |
          $v = '${{ steps.ver.outputs.version }}'
          $lines = Get-Content CHANGELOG.md
          $start = ($lines | Select-String -Pattern "^## \[$([regex]::Escape($v))\]" |
                    Select-Object -First 1).LineNumber
          if (-not $start) {
            Write-Warning "No '## [$v]' section in CHANGELOG.md; publishing a pointer instead."
            Set-Content RELEASE_BODY.md -Value "See [CHANGELOG.md](CHANGELOG.md) for the full history." -Encoding UTF8
            exit 0
          }

          # Stop at the last version users could actually install, not at the
          # previous CHANGELOG heading: a release that spans several versions
          # must carry every section since that tag, or the intervening notes
          # are never published anywhere.
          $prev = git tag --sort=-v:refname |
                  Where-Object { $_ -match '^v\d' -and $_ -ne "v$v" } |
                  Select-Object -First 1
          $end = $null
          if ($prev) {
            $pv = $prev -replace '^v', ''
            $end = ($lines | Select-String -Pattern "^## \[$([regex]::Escape($pv))\]" |
                    Select-Object -First 1).LineNumber
          }
          if (-not $end) {
            $end = ($lines | Select-String -Pattern '^## \[' |
                    Where-Object { $_.LineNumber -gt $start } |
                    Select-Object -First 1).LineNumber
          }
          $last = if ($end) { $end - 2 } else { $lines.Count - 1 }

          ($lines[($start - 1)..$last] -join "`n").TrimEnd() |
            Set-Content RELEASE_BODY.md -Encoding UTF8
          if ($prev) { Write-Host "Notes cover $v back to $prev" }
          Write-Host "--------"
          Get-Content RELEASE_BODY.md | Select-Object -First 20

      - name: Install Inno Setup
        shell: pwsh
        run: choco install innosetup --no-progress -y

      - name: Compile installer
        shell: pwsh
        run: |
          $v = '${{ steps.ver.outputs.version }}'
          $iscc = "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe"
          if (-not (Test-Path $iscc)) {
            $iscc = "${env:ProgramFiles}\Inno Setup 6\ISCC.exe"
          }
          & $iscc "/DAppVersion=$v" installer\winregister.iss
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          Write-Host ""
          Write-Host "Produced:"
          Get-ChildItem installer\output

      - name: Smoke test the installer (install, verify, uninstall)
        shell: pwsh
        timeout-minutes: 15
        run: |
          # The installer is the one path that cannot be exercised on a
          # developer machine: it restarts Explorer and rewrites the user's
          # shell. A throwaway runner is the only place that is free, so the
          # whole install -> assert -> uninstall cycle runs here, before the
          # release step, and blocks the release if any of it regresses.
          $ErrorActionPreference = 'Stop'
          $v = '${{ steps.ver.outputs.version }}'
          $setup = "installer\output\WinRegister-Setup-$v.exe"
          $script:failures = @()
          function Assert($ok, $msg) {
            if ($ok) { Write-Host "  [OK]   $msg" }
            else     { Write-Host "  [FAIL] $msg"; $script:failures += $msg }
          }

          # Bounded, never -Wait. Inno's [Run] step waits on WinRegister, so
          # anything that blocks in there blocks setup, and an unbounded wait
          # turns a diagnosable failure into a six-hour job timeout.
          Write-Host "== Installing =="
          $p = Start-Process -FilePath $setup -PassThru `
                 -ArgumentList '/VERYSILENT','/SUPPRESSMSGBOXES','/NORESTART','/LOG=inno-install.log'
          if (-not $p.WaitForExit(300000)) {
            Write-Host "::error::Installer still running after 5 minutes - dumping state"
            if (Test-Path inno-install.log) { Get-Content inno-install.log -Tail 60 }
            $wrLog = Join-Path $env:LOCALAPPDATA 'WinRegister\winregister.log'
            if (Test-Path $wrLog) { Write-Host "-- winregister.log --"; Get-Content $wrLog -Tail 40 }
            Get-Process | Where-Object { $_.Name -match 'powershell|WinRegister|unins|setup' } |
              Format-Table Name,Id,StartTime -AutoSize | Out-String | Write-Host
            $p | Stop-Process -Force -ErrorAction SilentlyContinue
            throw "Installer hung"
          }
          if ($p.ExitCode -ne 0) {
            if (Test-Path inno-install.log) { Get-Content inno-install.log -Tail 40 }
            throw "Installer exited $($p.ExitCode)"
          }

          $app     = Join-Path $env:LOCALAPPDATA 'WinRegister'
          $script  = Join-Path $app 'WinRegister.ps1'
          $classes = 'exefile','lnkfile','Directory'
          $verbs   = 'WinRegister.Register','WinRegister.Unregister'

          Write-Host "== Verifying the install footprint =="
          Assert (Test-Path $script) 'script deployed to %LOCALAPPDATA%\WinRegister'
          Assert (Test-Path (Join-Path $app 'winregister-launcher.exe')) 'launcher compiled at install time'
          Assert (Test-Path (Join-Path $app '.installed')) 'install marker written'
          foreach ($c in $classes) {
            foreach ($verb in $verbs) {
              Assert (Test-Path "HKCU:\Software\Classes\$c\shell\$verb") "verb key $c\$verb"
            }
          }

          # The verb must invoke a binary. A command that resolves through a file
          # association is owned by whoever claimed that extension - the failure
          # that killed the .vbs trampoline machine-wide.
          $cmd = (Get-ItemProperty "HKCU:\Software\Classes\exefile\shell\$($verbs[0])\command").'(default)'
          Assert ($cmd -like '*winregister-launcher.exe*') "Register verb runs the compiled launcher: $cmd"

          # -SkipSelfArp is the installer's own path and exists so WinRegister
          # never writes a second Apps & Features row beside Inno's. Nothing on a
          # developer machine exercises it.
          $owner = Join-Path $app '.self-arp-owner'
          Assert (Test-Path $owner) '.self-arp-owner marker written'
          if (Test-Path $owner) {
            Assert ((Get-Content $owner -Raw).Trim() -eq 'external') 'ARP row recorded as external, not owned'
          }
          $arpRoot = 'HKCU:\Software\Microsoft\Windows\CurrentVersion\Uninstall'
          Assert (-not (Test-Path "$arpRoot\WinRegister.Self")) 'no duplicate self ARP row beside the installer''s'
          Assert (Test-Path "$arpRoot\{E8E7A3B4-9C1D-4F5E-A8B2-D1E3F5A7C9D2}_is1") "Inno's own ARP row present"

          Write-Host "== Self-test, against the installed copy, under Windows PowerShell 5.1 =="
          & powershell.exe -NoProfile -ExecutionPolicy Bypass -File $script -SelfTest
          Assert ($LASTEXITCODE -eq 0) "self-test passes on a clean machine (exit $LASTEXITCODE)"

          $log = Join-Path $app 'winregister.log'
          if (Test-Path $log) { Write-Host "== install log =="; Get-Content $log -Tail 30 }

          Write-Host "== Uninstalling =="
          $unins = Join-Path $app 'unins000.exe'
          Assert (Test-Path $unins) 'uninstaller present'
          if (Test-Path $unins) {
            $u = Start-Process -FilePath $unins -PassThru `
                   -ArgumentList '/VERYSILENT','/SUPPRESSMSGBOXES','/NORESTART'
            if (-not $u.WaitForExit(300000)) {
              $u | Stop-Process -Force -ErrorAction SilentlyContinue
              throw "Uninstaller hung"
            }
            # Inno respawns itself out of %TEMP% to delete its own exe, so the
            # -Wait above returns while the real work is still running.
            $deadline = (Get-Date).AddMinutes(3)
            while ((Get-Process -Name '_iu*' -ErrorAction SilentlyContinue) -and (Get-Date) -lt $deadline) {
              Start-Sleep -Seconds 2
            }
            Start-Sleep -Seconds 3
          }

          Write-Host "== Verifying the uninstall =="
          foreach ($c in $classes) {
            foreach ($verb in $verbs) {
              Assert (-not (Test-Path "HKCU:\Software\Classes\$c\shell\$verb")) "verb key $c\$verb removed"
            }
          }
          Assert (-not (Test-Path $app)) 'install folder removed'

          if ($script:failures.Count -gt 0) {
            $script:failures | ForEach-Object { Write-Host "::error::installer smoke test: $_" }
            exit 1
          }
          Write-Host "Installer smoke test passed."

      - name: Build source ZIP fallback
        shell: pwsh
        run: |
          $v = '${{ steps.ver.outputs.version }}'
          New-Item -ItemType Directory -Path pack -Force | Out-Null
          Copy-Item WinRegister.ps1, README.md, CHANGELOG.md, LICENSE pack\
          Compress-Archive -Path pack\* -DestinationPath "WinRegister-$v-source.zip" -Force
          Get-ChildItem "WinRegister-$v-source.zip"

      - name: Upload artifacts (for non-release runs)
        if: github.event_name == 'workflow_dispatch'
        uses: actions/upload-artifact@v7
        with:
          name: WinRegister-${{ steps.ver.outputs.version }}
          path: |
            installer/output/WinRegister-Setup-${{ steps.ver.outputs.version }}.exe
            WinRegister-${{ steps.ver.outputs.version }}-source.zip

      - name: Attach to GitHub release (for tag pushes)
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v3
        with:
          # Without one of these the body is published empty - the action does
          # not fall back to the tag annotation.
          body_path: RELEASE_BODY.md
          generate_release_notes: true
          files: |
            installer/output/WinRegister-Setup-${{ steps.ver.outputs.version }}.exe
            WinRegister-${{ steps.ver.outputs.version }}-source.zip
          fail_on_unmatched_files: true
